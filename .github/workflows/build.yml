name: Build DEWZX AI Terminal

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Arduino CLI ───────────────────────────────────────
      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 platform
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.5

      # ── Libraries ─────────────────────────────────────────
      - name: Install libraries
        run: |
          arduino-cli lib install "TFT_eSPI@2.5.43"
          arduino-cli lib install "ArduinoJson@7.1.0"
          arduino-cli lib install "NimBLE-Arduino@1.4.2"

      # ── Configure TFT_eSPI (pin DEWZX) ────────────────────
      - name: Write TFT_eSPI User_Setup.h
        run: |
          TFT_DIR="$HOME/Arduino/libraries/TFT_eSPI"
          cat > "$TFT_DIR/User_Setup.h" << 'EOF'
          // Auto-generated by build.yml — DEWZX ST7789 240x240
          #pragma once
          #define ST7789_DRIVER
          #define TFT_WIDTH     240
          #define TFT_HEIGHT    240
          #define TFT_MOSI       20
          #define TFT_SCLK       19
          #define TFT_CS          3
          #define TFT_DC         47
          #define TFT_RST        21
          #define SPI_FREQUENCY       27000000
          #define SPI_READ_FREQUENCY   5000000
          #define LOAD_GLCD
          #define LOAD_FONT2
          #define LOAD_FONT4
          EOF

      # ── Compile ───────────────────────────────────────────
      - name: Compile sketch
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,PartitionScheme=huge_app,PSRAM=opi" \
            --build-property "build.extra_flags=-DBOARD_HAS_PSRAM=1" \
            --output-dir ./build \
            ./DEWZX_AI_TERMINAL
          echo "Build complete!"
          ls -lh ./build/*.bin 2>/dev/null || true

      # ── Upload .bin artifact ──────────────────────────────
      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dewzx-ai-terminal-firmware
          path: |
            ./build/*.bin
            ./build/*.elf
          retention-days: 30
